ng:6px 8px; border-radius:4px; background:#0c2730; color:#eafcff; font:600 11px/1 Inter,\"PingFang SC\",sans-serif; white-space:nowrap; opacity:0; transform:translateX(4px); pointer-events:none; transition:opacity .18s ease,transform .18s ease; }.back-to-top.is-visible { opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }.back-to-top:hover { background:#0b8fa7; color:#fff; box-shadow:0 14px 30px rgba(0,131,157,.24),0 0 0 4px rgba(16,204,227,.10); transform:translateY(-3px) scale(1.04); }.back-to-top:hover::after { opacity:1; transform:translateX(0); }.back-to-top svg { width:18px; height:18px; transition:transform .2s ease; }.back-to-top:hover svg { transform:translateY(-2px); } html[data-theme=\"dark\"] .back-to-top { background:rgba(13,29,36,.84); color:#6de8f5; box-shadow:0 10px 25px rgba(0,0,0,.28); } html[data-theme=\"dark\"] .back-to-top:hover { background:#008ca4; color:#fff; } @media (max-width:560px) { .back-to-top { right:16px; bottom:20px; width:39px; height:39px; }.back-to-top::after { display:none; } } @media (prefers-reduced-motion:reduce) { .back-to-top,.back-to-top * { transition:none!important; } }\n      `;\n\n      /**\n       * Adds the fixed, initially hidden control used to return to the document top.\n       * @returns {HTMLButtonElement} Back-to-top button element.\n       */\n      function addBackToTopControl() {\n        const button = document.createElement('button');\n        button.className = 'back-to-top';\n        button.type = 'button';\n        button.title = '返回顶部';\n        button.setAttribute('aria-label', '返回顶部');\n        button.innerHTML = '\u003Csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003Cpath d=\"m18 15-6-6-6 6\">\u003C/path>\u003Cpath d=\"M12 9v11\">\u003C/path>\u003C/svg>';\n        app.append(button);\n        return button;\n      }\n\n      /**\n       * Reveals the control after the reader leaves the first hero viewport.\n       * @param {HTMLButtonElement} button Back-to-top button element.\n       * @returns {void}\n       */\n      function enableBackToTopVisibility(button) {\n        const updateVisibility = () => button.classList.toggle('is-visible', window.scrollY > 440);\n        window.addEventListener('scroll', updateVisibility, { passive:true });\n        updateVisibility();\n      }\n\n      /**\n       * Scrolls to the document top with the motion preference selected by the reader's system.\n       * @returns {void}\n       */\n      function scrollToTop() {\n        const behavior = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';\n        window.scrollTo({ top:0, behavior });\n      }\n\n      /**\n       * Waits for the nested local prototype to render before adding the page-level utility control.\n       * @returns {void}\n       */\n      function enhanceRenderedPrototype() {\n        if (!app.querySelector('.signal-hero')) {\n          window.setTimeout(enhanceRenderedPrototype, 80);\n          return;\n        }\n        const styleNode = document.createElement('style');\n        styleNode.textContent = backTopCss;\n        document.head.append(styleNode);\n        const button = addBackToTopControl();\n        button.addEventListener('click', scrollToTop);\n        enableBackToTopVisibility(button);\n      }\n\n      /**\n       * Executes the latest trusted local prototype script in the current preview document.\n       * @param {string} sourceMarkup Raw HTML of the prior agent-created prototype.\n       * @returns {void}\n       */\n      function renderSourcePrototype(sourceMarkup) {\n        const sourceDocument = new DOMParser().parseFromString(sourceMarkup, 'text/html');\n        const prototypeScript = sourceDocument.querySelector('script')?.textContent;\n        if (!prototypeScript) throw new Error('展示脚本不存在');\n        new Function(prototypeScript)();\n        enhanceRenderedPrototype() Script) throw new Error('展示脚本不存在');\n        new Function(prototypeScript)();\n        applyLightThemeBalance();\n      }\n\n      fetch(sourcePage)\n        .then((response) => response.ok ? response.text() : Promise.reject(new Error('无法加载展示页面')))\n        .then(renderSourcePrototype)\n        .catch(() => { app.textContent = '展示页面加载失败。'; });\n    })();\n  \u003C/script>\n\u003C/body>\n\u003C/html>\n","/files/homepage-editorial-motion.html":"\u003C!DOCTYPE html>\n\u003Chtml lang=\"zh-CN\">\n\u003Chead>\n  \u003Cmeta charset=\"UTF-8\">\n  \u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003Ctitle>AI Radar - Editorial Motion System\u003C/title>\n\u003C/head>\n\u003Cbody>\n  \u003Cdiv id=\"app\" aria-live=\"polite\">\u003C/div>\n  \u003Cscript>\n    /** Loads the approved prototype and layers a staged, viewport-triggered editorial motion system on top. */\n    (() => {\n      const app = document.querySelector('#app');\n      const sourcePage = '/files/homepage-hover-restored.html';\n      const motionCss = `\n        .reading-progress { position:fixed; z-index:60; top:71px; left:0; width:100%; height:2px; overflow:hidden; pointer-events:none; background:rgba(16,204,227,.06); }.reading-progress > i { display:block; width:100%; height:100%; background:linear-gradient(90deg,#10cce3,#c4ff67); box-shadow:0 0 12px rgba(16,204,227,.78); transform:scaleX(0); transform-origin:left center; }.motion-cue { opacity:0; transition:opacity .64s ease,transform .72s cubic-bezier(.2,.8,.2,1),filter .64s ease; }.motion-cue.is-revealed { opacity:1; filter:blur(0); transform:translate3d(0,0,0) scale(1); }.cue-left { filter:blur(4px); transform:translate3d(-56px,0,0); }.cue-right { filter:blur(4px); transform:translate3d(56px,0,0); }.cue-up { filter:blur(3px); transform:translate3d(0,34px,0); }.cue-scale { filter:blur(3px); transform:scale(.94); }.section-head.motion-cue { transition-delay:.03s; }.feature-card.motion-cue { transition-delay:.12s; }.rail-card.motion-cue:nth-of-type(2) { transition-delay:.1s; }.rail-card.motion-cue:nth-of-type(3) { transition-delay:.2s; }.rail-card.motion-cue:nth-of-type(4) { transition-delay:.3s; }.tool-card.motion-cue:nth-child(2) { transition-delay:.13s; }.tool-card.motion-cue:nth-child(3) { transition-delay:.26s; }.footer-grid > div.motion-cue:nth-child(2) { transition-delay:.11s; }.footer-grid > div.motion-cue:nth-child(3) { transition-delay:.22s; }\n        .section-head h2 { transition:color .24s ease,text-shadow .24s ease; }.section-head.is-revealed h2 { text-shadow:0 8px 24px rgba(16,204,227,.10); }.section-head a { display:inline-flex; align-items:center; gap:7px; transition:gap .22s ease,color .22s ease; }.section-head a:hover { color:#12cce3!important; gap:12px; }.section-head a::after { content:\"→\"; transition:transform .22s ease; }.section-head a:hover::after { transform:translateX(4px); }\n        .feature-card .feature-label { animation:tag-idle 2.8s ease-in-out infinite; }.feature-card:hover .feature-label { animation:none; }.tool-card:hover::after,.rail-card:hover::after { content:\"\"; position:absolute; inset:0; pointer-events:none; border-radius:inherit; background:linear-gradient(110deg,transparent 28%,rgba(255,255,255,.38) 48%,transparent 68%); transform:translateX(-120%); animation:card-sheen .65s ease-out both; }.tool-card,.rail-card { position:relative; }\n        @keyframes tag-idle { 0%,100% { box-shadow:0 0 0 rgba(196,255,103,0); } 50% { box-shadow:0 0 0 4px rgba(196,255,103,.10); } } @keyframes card-sheen { to { transform:translateX(120%); } }\n        @media (prefers-reduced-motion:reduce) { .reading-progress { display:none; }.motion-cue,.motion-cue *,.feature-card .feature-label { animation:none!important; transition:none!important; filter:none!important; transform:none!important; opacity:1!important; } }\n        @media (max-width:560px) { .reading-progress { top:63px; }.cue-left,.cue-right { transform:translate3d(0,28px,0); } }\n      `;\n\n      /**\n       * Adds the fixed reading progress indicator used to show movement through the editorial feed.\n       * @returns {HTMLElement} Progress fill element.\n       */\n      function addReadingProgress() {\n        const progress = document.createElement('div');\n        progress.className = 'reading-progress';\n        progress.setAttribute('aria-hidden', 'true');\n        progress.innerHTML = '\u003Ci>\u003C/i>';\n        app.prepend(progress);\n        return progress.firstElementChild;\n      }\n\n      /**\n       * Keeps the progress indicator in sync with page scroll without layout reads on every paint.\n       * @param {HTMLElement} fill Progress fill element.\n       * @returns {void}\n       */\n      function enableReadingProgress(fill) {\n        let isQueued = false;\n        const updateProgress = () => {\n          const scrollable = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);\n          const ratio = Math.min(1, Math.max(0, window.scrollY / scrollable));\n          fill.style.transform = `scaleX(${ratio})`;\n          isQueued = false;\n        };\n        const handleScroll = () => {\n          if (isQueued) return;\n          isQueued = true;\n          window.requestAnimationFrame(updateProgress);\n        };\n        window.addEventListener('scroll', handleScroll, { passive:true });\n        updateProgress();\n      }\n\n      /**\n       * Assigns different entry directions to content groups and activates each group on its first viewport entry.\n       * @returns {void}\n       */\n      function enableStagedReveal() {\n        const groups = [\n          ['.section-head', 'cue-left'],\n          ['.feature-card', 'cue-left'],\n          ['.rail-card', 'cue-right'],\n          ['.tool-card', 'cue-up'],\n          ['.project', 'cue-scale'],\n          ['.latest-item', 'cue-right'],\n          ['.footer-grid > div', 'cue-up']\n        ];\n        const items = [];\n        for (const [selector, direction] of groups) {\n          for (const element of app.querySelectorAll(selector)) {\n            element.classList.add('motion-cue', direction);\n            items.push(element);\n          }\n        }\n        if (!('IntersectionObserver' in window)) {\n          for (const item of items) item.classList.add('is-revealed');\n          return;\n        }\n        const observer = new IntersectionObserver((entries, observed) => {\n          for (const entry of entries) {\n            if (!entry.isIntersecting) continue;\n            entry.target.classList.add('is-revealed');\n            observed.unobserve(entry.target);\n          }\n        }, { threshold:0.14, rootMargin:'0px 0px -8% 0px' });\n        for (const item of items) observer.observe(item);\n      }\n\n      /**\n       * Injects the final motion layer after the nested local prototype has completed its asynchronous render.\n       * @returns {void}\n       */\n      function enhanceRenderedPrototype() {\n        if (!app.querySelector('.signal-hero') || !app.querySelector('.tool-card')) {\n          window.setTimeout(enhanceRenderedPrototype, 80);\n          return;\n        }\n        const styleNode = document.createElement('style');\n        styleNode.textContent = motionCss;\n        document.head.append(styleNode);\n        enableStagedReveal();\n        enableReadingProgress(addReadingProgress());\n      }\n\n      /**\n       * Executes the latest trusted local prototype script in the current preview document.\n       * @param {string} sourceMarkup Raw HTML of the prior agent-created prototype.\n       * @returns {void}\n       */\n      function renderSourcePrototype(sourceMarkup) {\n        const sourceDocument = new DOMParser().parseFromString(sourceMarkup, 'text/html');\n        const prototypeScript = sourceDocument.querySelector('script')?.textContent;\n        if (!prototypeScript) throw new Error('展示脚本不存在');\n        new Function(prototypeScript)();\n        enhanceRenderedPrototype();\n      }\n\n tro h1 { font-size:43px; }.intro p { margin-left:0; }.section { padding:52px 0; }.feature-card { min-height:304px; }.feature-card h3 { margin-top:119px; font-size:28px; }.section-head h2 { font-size:27px; }.footer-grid { grid-template-columns:1fr; }.footer-grid > :first-child { grid-column:auto; } }\n  \u003C/style>\n\u003C/head>\n\u003Cbody>\n  \u003Cheader class=\"topbar\">\u003Cdiv class=\"wrap topbar-inner\">\u003Ca class=\"brand\" href=\"#\">\u003Cspan class=\"brand-mark\">✦\u003C/span>AI Radar\u003C/a>\u003Cnav class=\"site-nav\" aria-label=\"主导航\">\u003Ca href=\"#\">资讯\u003C/a>\u003Ca href=\"#\">工具\u003C/a>\u003Ca href=\"#\">开源\u003C/a>\u003Ca href=\"#\">榜单\u003C/a>\u003C/nav>\u003Cdiv class=\"actions\">\u003Clabel class=\"search-box\" aria-label=\"搜索内容\">\u003Cspan class=\"search-icon\">⌕\u003C/span>\u003Cinput type=\"search\" placeholder=\"搜索资讯、工具、项目\">\u003Cspan class=\"keycap\">⌘ K\u003C/span>\u003C/label>\u003Cdiv class=\"theme-control\" role=\"group\" aria-label=\"主题模式\">\u003Cbutton type=\"button\" title=\"切换到浅色主题\" aria-label=\"切换到浅色主题\" data-theme-mode=\"light\">\u003Cspan class=\"theme-icon\">☀\u003C/span>\u003Cspan class=\"theme-label\">浅色\u003C/span>\u003C/button>\u003Cbutton type=\"button\" title=\"切换到深色主题\" aria-label=\"切换到深色主题\" data-theme-mode=\"dark\">\u003Cspan class=\"theme-icon\">◐\u003C/span>\u003Cspan class=\"theme-label\">深色\u003C/span>\u003C/button>\u003Cbutton type=\"button\" title=\"跟随系统主题\" aria-label=\"跟随系统主题\" data-theme-mode=\"system\">\u003Cspan class=\"theme-icon\">▣\u003C/span>\u003Cspan class=\"theme-label\">跟随\u003C/span>\u003C/button>\u003C/div>\u003C/div>\u003C/div>\u003C/header>\n  \u003Cmain>\u003Csection class=\"intro\">\u003Cdiv class=\"wrap\">\u003Cdiv class=\"intro-kicker\">中文 AI 资讯与资源发现\u003C/div>\u003Ch1>AI Radar\u003C/h1>\u003Cp>给开发者和 AI 使用者的一份编辑型信息流。工具、开源项目和行业动态，各自清楚地呈现，也都指向可靠的原始来源。\u003C/p>\u003C/div>\u003C/section>\u003Csection class=\"section stories\">\u003Cdiv class=\"wrap\">\u003Cdiv class=\"section-head\">\u003Cdiv>\u003Cdiv class=\"section-kicker\">TOP STORY\u003C/div>\u003Ch2>值得先看的内容\u003C/h2>\u003C/div>\u003Ca href=\"#\">浏览全部资讯 →\u003C/a>\u003C/div>\u003Cdiv class=\"story-grid\">\u003Carticle class=\"feature-card\">\u003Cspan class=\"feature-label\">本周焦点 · 开源工作流\u003C/span>\u003Ch3>AI Agent 开始进入真实的开发工作流\u003C/h3>\u003Cp>从 MCP 到本地工具调用，项目正在从 Demo 走向可维护的生产能力。\u003C/p>\u003C/article>\u003Caside class=\"rail\">\u003Cdiv class=\"rail-head\">\u003Cb>正在发生\u003C/b>\u003Cspan>全部资讯 →\u003C/span>\u003C/div>\u003Carticle class=\"rail-card\">\u003Clabel>模型与 API\u003C/label>\u003Ch3>国内模型的新一轮长上下文能力竞争，进入可用性阶段\u003C/h3>\u003Cp>机器之心 · 18 分钟前\u003C/p>\u003C/article>\u003Carticle class=\"rail-card\">\u003Clabel>官方更新\u003C/label>\u003Ch3>OpenAI 发布新的开发者工作流指南\u003C/h3>\u003Cp>官方博客 · 1 小时前\u003C/p>\u003C/article>\u003Carticle class=\"rail-card\">\u003Clabel>产品动态\u003C/label>\u003Ch3>多模态创作工具把焦点放回“可控生成”\u003C/h3>\u003Cp>量子位 · 2 小时前\u003C/p>\u003C/article>\u003C/aside>\u003C/div>\u003C/div>\u003C/section>\u003Csection class=\"section tools\">\u003Cdiv class=\"wrap\">\u003Cdiv class=\"section-head\">\u003Cdiv>\u003Cdiv class=\"section-kicker\">TOOLS TO TRY\u003C/div>\u003Ch2>本周值得试用的工具\u003C/h2>\u003C/div>\u003Ca href=\"#\">进入工具目录 →\u003C/a>\u003C/div>\u003Cdiv class=\"tool-grid\">\u003Carticle class=\"tool-card\">\u003Cdiv class=\"tool-icon\">C\u003C/div>\u003Ch3>Cursor\u003C/h3>\u003Cp>为代码库工作流设计的 AI 编辑器，覆盖理解项目、实现与审查的持续开发任务。\u003C/p>\u003Cdiv class=\"tool-meta\">\u003Cspan>编程开发\u003C/span>\u003Cb>热度 97.2\u003C/b>\u003C/div>\u003C/article>\u003Carticle class=\"tool-card\">\u003Cdiv class=\"tool-icon\">N\u003C/div>\u003Ch3>NotebookLM\u003C/h3>\u003Cp>围绕你提供的资料进行问答、归纳和表达，适合把复杂内容整理为可使用的知识。\u003C/p>\u003Cdiv class=\"tool-meta\">\u003Cspan>知识工作\u003C/span>\u003Cb>热度 91.6\u003C/b>\u003C/div>\u003C/article>\u003Carticle class=\"tool-card\">\u003Cdiv class=\"tool-icon\">R\u003C/div>\u003Ch3>Runway\u003C/h3>\u003Cp>面向创意生产的生成式视频工具，覆盖镜头、编辑与可控的视频工作流。\u003C/p>\u003Cdiv class=\"tool-meta\">\u003Cspan>图像与视频\u003C/span>\u003Cb>热度 88.9\u003C/b>\u003C/div>\u003C/article>\u003C/div>\u003C/div>\u003C/section>\u003C/main>\u003Cfooter class=\"footer\">\u003Cdiv class=\"wrap\">\u003Cdiv class=\"footer-grid\">\u003Cdiv>\u003Cdiv class=\"footer-brand\">\u003Ci>✦\u003C/i>AI Radar\u003C/div>\u003Cp class=\"footer-copy\">面向中文开发者与 AI 使用者的资讯和资源发现站。让值得关注的内容，有清晰的去处。\u003C/p>\u003C/div>\u003Cdiv class=\"footer-col\">\u003Cb>探索\u003C/b>\u003Cspan>今日资讯\u003C/span>\u003Cspan>工具目录\u003C/span>\u003Cspan>开源项目\u003C/span>\u003Cspan>热门榜单\u003C/span>\u003C/div>\u003Cdiv class=\"footer-col\">\u003Cb>内容来源\u003C/b>\u003Cdiv class=\"source-chips\">\u003Cspan>GitHub API\u003C/span>\u003Cspan>Hugging Face\u003C/span>\u003Cspan>官方博客\u003C/span>\u003Cspan>公开 RSS\u003C/span>\u003C/div>\u003C/div>\u003C/div>\u003Cdiv class=\"copyright\">© 2026 AI Radar · 自动聚合，跳转原始来源阅读 · 公开浏览，无需账号\u003C/div>\u003C/div>\u003C/footer>\n  \u003Cscript>\n    /** Initializes the visual prototype's local-only search shortcut and theme controls. */\n    (() => {\n      const root = document.documentElement;\n      const input = document.querySelector('input[type=\"search\"]');\n      const themeButtons = [...document.querySelectorAll('[data-theme-mode]')];\n      const systemPreference = window.matchMedia('(prefers-color-scheme: dark)');\n\n      /**\n       * Resolves an explicit choice to the actual rendered palette.\n       * @param {'light' | 'dark' | 'system'} mode Selected theme behavior.\n       * @returns {'light' | 'dark'} Effective theme palette.\n       */\n      function resolveTheme(mode) {\n        return mode === 'system' ? (systemPreference.matches ? 'dark' : 'light') : mode;\n      }\n\n      /**\n       * Applies the selected theme, records it locally, and updates active controls.\n       * @param {'light' | 'dark' | 'system'} mode Selected theme behavior.\n       * @returns {void}\n       */\n      function applyTheme(mode) {\n        const theme = resolveTheme(mode);\n        root.dataset.theme = theme;\n        root.dataset.mode = mode;\n        for (const button of themeButtons) {\n          const isActive = button.dataset.themeMode === mode;\n          button.classList.toggle('is-active', isActive);\n          button.setAttribute('aria-pressed', String(isActive));\n        }\n      }\n\n      /**\n       * Changes the theme using the mode requested by a themed control button.\n       * @param {MouseEvent} event Theme button click event.\n       * @returns {void}\n       */\n      function handleThemeClick(event) {\n        const mode = event.currentTarget.dataset.themeMode;\n        localStorage.setItem('ai-radar-theme-mode', mode);\n        applyTheme(mode);\n      }\n\n      /**\n       * Focuses the search input for the standard Command/Ctrl + K shortcut.\n       * @param {KeyboardEvent} event Keyboard event from the page document.\n       * @returns {void}\n       */\n      function handleSearchShortcut(event) {\n        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {\n          event.preventDefault();\n          input.focus();\n        }\n      }\n\n      /**\n       * Keeps the displayed palette synchronized when following the operating system.\n       * @returns {void}\n       */\n      function handleSystemThemeChange() {\n        if (root.dataset.mode === 'system') applyTheme('system');\n      }\n\n      const storedMode = localStorage.getItem('ai-radar-theme-mode');\n      applyTheme(storedMode === 'dark' || storedMode === 'system' ? storedMode : 'light');\n      for (const button of themeButtons) button.addEventListener('click', handleThemeClick);\n      document.addEventListener('keydown', handleSearchShortcut);\n      systemPreference.addEventListener('change', handleSystemThemeChange);\n    })();\n  \u003C/script>\n\u003C/body>\n\u003C/html>\n"});

      /**
       * Serves only known prototype documents from the embedded source map.
       * @param {string | Request} resource Prototype document path requested by an inherited visual layer.
       * @returns {Promise<{ok: boolean, text: () => Promise<string>}>} A fetch-compatible local response.
       */
      function resolvePrototypeSource(resource) {
        const sourcePath = typeof resource === 'string' ? resource : resource.url;
        const sourceMarkup = prototypeSources[sourcePath];
        if (sourceMarkup === undefined) return Promise.reject(new Error('离线原型资源不存在'));
        return Promise.resolve({ ok: true, text: () => Promise.resolve(sourceMarkup) });
      }

      window.fetch = resolvePrototypeSource;
    })();
  </script>

  <script>
    /** Loads the latest homepage prototype, fixes the utility placement, and sharpens the signal-hero typography. */
    (() => {
      const app = document.querySelector('#app');
      const sourcePage = '/files/homepage-back-to-top.html';
      const terminalCss = `
        .back-to-top { right:22px!important; bottom:28px!important; } @media (max-width:560px) { .back-to-top { right:16px!important; bottom:20px!important; } }
        .hero-brand { position:relative; gap:17px!important; padding:7px 0 10px; overflow:visible!important; font-family:"Avenir Next","Helvetica Neue","PingFang SC",sans-serif!important; font-size:clamp(62px,8vw,116px)!important; font-weight:600!important; line-height:.86!important; letter-spacing:.065em!important; text-transform:uppercase; }.hero-brand::before { content:""; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent 0 7%,rgba(0,169,192,.56) 7% 43%,rgba(0,169,192,.15) 43% 57%,rgba(0,169,192,.56) 57% 93%,transparent 93%); opacity:.72; }.hero-brand span { position:relative; display:inline-block; text-shadow:none!important; }.hero-brand span::after { content:none!important; }.hero-brand .ai { color:#063642!important; font-weight:680!important; text-shadow:0 7px 20px rgba(0,142,164,.10)!important; }.hero-brand .radar { color:transparent!important; font-weight:520!important; -webkit-text-stroke:1.55px #009bb2; text-shadow:0 0 17px rgba(0,164,187,.16)!important; }.hero-brand .radar::before { content:""; position:absolute; inset:16% -4px 17%; border-top:1px solid rgba(16,204,227,.82); border-bottom:1px solid rgba(16,204,227,.42); opacity:.8; transform:scaleX(0); transform-origin:left; }
        .hero-meta { width:min(100%,1050px)!important; font-family:"Avenir Next","Helvetica Neue","PingFang SC",sans-serif!important; font-size:10px!important; font-weight:650!important; letter-spacing:.14em!important; color:#197d8e!important; }.hero-meta span:first-child::before { content:"01"; display:inline-grid; place-items:center; width:22px; height:16px; margin-right:9px; border:1px solid rgba(0,157,181,.54); color:#008ea6; font-size:8px; letter-spacing:0; }.hero-meta span:first-child::after { content:none!important; }.hero-meta i { display:none!important; }.hero-meta span:last-child { color:#4d8490!important; }.hero-slogan { max-width:760px!important; font-size:19px!important; letter-spacing:.035em!important; color:#50747c!important; }.hero-slogan strong { color:#063642!important; font-weight:650!important; }.hero-slogan .signal-slash { display:none!important; }.hero-baseline { color:#008ca4!important; font-family:"Avenir Next","Helvetica Neue","PingFang SC",sans-serif!important; font-size:10px!important; font-weight:650!important; letter-spacing:.18em!important; }.hero-baseline:before,.hero-baseline:after { background:linear-gradient(90deg,transparent,rgba(0,174,199,.68))!important; }
        html[data-theme="dark"] .hero-brand .ai { color:#ebfbff!important; text-shadow:0 0 22px rgba(82,222,242,.17)!important; } html[data-theme="dark"] .hero-brand .radar { -webkit-text-stroke-color:#63e7f4; text-shadow:0 0 20px rgba(82,222,242,.26)!important; } html[data-theme="dark"] .hero-meta { color:#65dce9!important; } html[data-theme="dark"] .hero-meta span:last-child { color:#95bcc3!important; } html[data-theme="dark"] .hero-slogan { color:#aac7ce!important; } html[data-theme="dark"] .hero-slogan strong { color:#effcff!important; }
        @media (prefers-reduced-motion:no-preference) { .hero-brand .radar::before { animation:radar-line 2.8s 1.1s cubic-bezier(.22,.75,.24,1) infinite; } @keyframes radar-line { 0%,14% { opacity:0; transform:scaleX(0); } 36%,76% { opacity:.8; transform:scaleX(1); } 100% { opacity:0; transform:scaleX(1); } } }
        @media (prefers-reduced-motion:reduce) { .hero-brand .radar::before { animation:none!important; } }
        @media (max-width:560px) { .hero-brand { gap:6px!important; padding-top:5px; font-size:64px!important; letter-spacing:.035em!important; }.hero-brand .radar { -webkit-text-stroke-width:1px; }.hero-slogan { max-width:355px!important; font-size:15px!important; } }
      `;

      /**
       * Updates the title region with product-style labels while preserving the existing hero layout.
       * @returns {void}
       */
      function sharpenHeroCopy() {
        const meta = app.querySelectorAll('.hero-meta span');
        if (meta[0]) meta[0].textContent = 'AI 情报雷达';
        if (meta[1]) meta[1].textContent = '实时捕捉 · 持续更新';
        const slogan = app.querySelector('.hero-slogan');
        if (slogan) slogan.innerHTML = '<strong>发现真正值得关注的 AI 变化。</strong>';
        const baseline = app.querySelector('.hero-baseline');
        if (baseline) baseline.textContent = 'EXPLORE THE NEXT SIGNAL';
      }

      /**
       * Adds the final fixed-position and terminal-title style layer after the nested prototype is ready.
       * @returns {void}
       */
      function enhanceRenderedPrototype() {
        if (!app.querySelector('.signal-hero') || !app.querySelector('.back-to-top')) {
          window.setTimeout(enhanceRenderedPrototype, 80);
          return;
        }
        const styleNode = document.createElement('style');
        styleNode.textContent = terminalCss;
        document.head.append(styleNode);
        sharpenHeroCopy();
      }

      /**
       * Executes the latest trusted local prototype script in the current preview document.
       * @param {string} sourceMarkup Raw HTML of the prior agent-created prototype.
       * @returns {void}
       */
      function renderSourcePrototype(sourceMarkup) {
        const sourceDocument = new DOMParser().parseFromString(sourceMarkup, 'text/html');
        const prototypeScript = sourceDocument.querySelector('script')?.textContent;
        if (!prototypeScript) throw new Error('展示脚本不存在');
        new Function(prototypeScript)();
        enhanceRenderedPrototype();
      }

      fetch(sourcePage)
        .then((response) => response.ok ? response.text() : Promise.reject(new Error('无法加载展示页面')))
        .then(renderSourcePrototype)
        .catch(() => { app.textContent = '展示页面加载失败。'; });
    })();
  </script>
